name: Build & Deploy (melodan.com)

on:
  push:
    branches: ['**']
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Every branch lands in its own folder on the Melodan All-Inkl account (w0226efe),
# over rsync + SSH: <root>/branches/<branch>/, served as https://dev.melodan.com/<branch>/.
# melodan.com, www and play.melodan.com point at branches/main; its hand-placed
# .htaccess (the repo's .htaccess.melodan) picks web.html or index.html by host —
# excluded below, so a deploy never touches it.
#
# The SSH user is locked into its own view (chroot); DEPLOY_ROOT is that view's path.
#
# Secrets: SSH_DEPLOY_KEY (private ed25519 key; its public half is in KAS for the
# SSH user) and SSH_KNOWN_HOSTS (`ssh-keyscan -t ed25519,rsa w0226efe.kasserver.com`).
#
# rsync compares by checksum, not by timestamp: a fresh build has new timestamps on
# every file, and FTP's lftp mirror re-sent all 205 MB / 3,200 files each time.
#
# Never create git branches named like the folders the PHP backend keeps its data in
# (see the excludes) — and `backend` is reserved, as before.
env:
  DEPLOY_HOST: w0226efe.kasserver.com
  DEPLOY_USER: ssh-w0226efe
  DEPLOY_ROOT: /www/htdocs/w0226efe/melodan.com/branches

jobs:
  build:
    name: Build site
    if: |
      github.event_name != 'delete' &&
      (
        github.event_name == 'workflow_dispatch' ||
        !contains(fromJSON('["backend"]'), github.ref_name)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to melodan.com (rsync)
    needs: build
    if: |
      github.event_name != 'delete' &&
      (
        github.event_name == 'workflow_dispatch' ||
        !contains(fromJSON('["backend"]'), github.ref_name)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # the chat / suggest admin key lives only in the repo secret — injected
      # into the PHP just before upload, never in git or the build artifact
      - name: Inject chat admin key
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "ADMIN_KEY secret not set — suggest inbox stays disabled"
          else
            python3 - <<'PY'
          import os
          key = os.environ['ADMIN_KEY'].replace('\\', '\\\\').replace("'", "\\'")
          needle = "const ADMIN_KEY = '__ADMIN_KEY__';"
          repl = f"const ADMIN_KEY = '{key}';"
          for path in ('dist/backend/suggest.php', 'dist/backend/diag.php'):
              src = open(path).read()
              if needle not in src:
                  raise SystemExit(f'placeholder not found in {path}')
              # Only replace the const — a global __ADMIN_KEY__ replace also
              # rewrites the "still a placeholder?" check and breaks auth.
              open(path, 'w').write(src.replace(needle, repl, 1))
              print('admin key injected into', path)
          PY
          fi

      - name: Set up SSH
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_DEPLOY_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "SSH_DEPLOY_KEY / SSH_KNOWN_HOSTS secret missing" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # --checksum: content decides, not the build's fresh timestamps.
      # --delete keeps the folder exactly the build, but never touches the
      # excluded data folders (rsync leaves excluded files alone).
      - name: Deploy with rsync
        run: |
          folder="${{ github.ref_name }}"
          echo "Deploying to https://dev.melodan.com/$folder/"
          rsync -rlz --checksum --delete --mkpath \
            --chmod=D755,F644 \
            --exclude '.htaccess' \
            --exclude '.htpasswd' \
            --exclude 'stats/' \
            --exclude 'backend/stats/' \
            --exclude 'players/' \
            --exclude 'backend/players/' \
            --exclude 'suggestions/' \
            --exclude 'backend/suggestions/' \
            --stats \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            ./dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/$folder/"

  cleanup:
    name: Remove branch preview folder
    if: |
      github.event_name == 'delete' &&
      github.event.ref_type == 'branch' &&
      github.event.ref != 'main' &&
      github.event.ref != 'master' &&
      !contains(fromJSON('["backend"]'), github.event.ref)
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Remove the branch folder
        env:
          FOLDER: ${{ github.event.ref }}
        run: |
          # one plain folder name only — never an empty name, a path or a dot name
          case "$FOLDER" in
            ''|*/*|.*) echo "refusing to remove '$FOLDER'" >&2; exit 1 ;;
          esac
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf -- '$DEPLOY_ROOT/$FOLDER'"
