<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MELODAN — diagnostics</title>
  <style>
    :root { --bg: #1a1814; --panel: #242018; --ink: #e8e0d0; --muted: #9a9080; --accent: #c4a574; --line: #3a3428; --bad: #b86a5a; --good: #7a9e6a; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 "IBM Plex Sans", "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); padding: 24px; }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 4px; }
    .sub { color: var(--muted); margin-bottom: 16px; }
    input, button { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
    button { cursor: pointer; }
    .group { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 12px 0; }
    .group h2 { font-size: 1rem; margin: 0 0 8px; }
    table { border-collapse: collapse; width: 100%; }
    td, th { text-align: left; padding: 4px 8px; border-top: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .kind-desync { color: var(--bad); }
    .diff { color: var(--bad); font-weight: 600; }
    .same { color: var(--good); }
    pre { white-space: pre-wrap; word-break: break-word; background: #12100d; padding: 12px; border-radius: 6px; max-height: 70vh; overflow: auto; font-size: 12px; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <h1>Diagnostics</h1>
  <div class="sub">Desync and error reports, grouped by match. A desync is reported by every client of the match — compare reports picks the first hash section where they disagree.</div>
  <div>
    <input id="key" type="password" placeholder="admin key" size="28" />
    <button id="load">Load</button>
    <span id="status" class="muted"></span>
  </div>
  <div id="groups"></div>
  <div id="detail"></div>
<script>
const api = new URL('diag.php', location.href).href;
const keyEl = document.getElementById('key');
keyEl.value = localStorage.getItem('melodan-diag-key') || '';
const statusEl = document.getElementById('status');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const when = (ts) => new Date(ts * 1000).toLocaleString();

async function call(params) {
  const url = `${api}?${new URLSearchParams({ ...params, key: keyEl.value })}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

async function load() {
  localStorage.setItem('melodan-diag-key', keyEl.value);
  statusEl.textContent = 'loading…';
  try {
    const { groups } = await call({ action: 'list', limit: 200 });
    statusEl.textContent = `${groups.length} match(es)`;
    document.getElementById('groups').innerHTML = groups.map((g) => `
      <div class="group">
        <h2>match ${esc(g.matchKey)} <span class="muted">${when(g.ts)}</span>
          <button data-compare="${esc(g.reports.filter((r) => r.kind === 'desync').map((r) => r.id).join(','))}">compare desync reports</button>
          <button data-copy-match="${esc(g.matchKey)}">copy whole match</button>
          <button data-download-match="${esc(g.matchKey)}">download whole match</button></h2>
        <table><tr><th>time</th><th>kind</th><th>round</th><th>role</th><th>name</th><th>version</th><th>key</th><th>platform</th><th></th></tr>
        ${g.reports.map((r) => `<tr><td>${when(r.ts)}</td><td class="kind-${esc(r.kind)}">${esc(r.kind)}</td><td>${esc(r.round)}</td>
          <td>${esc(r.role)}</td><td>${esc(r.name)}</td><td>${esc(r.appVersion)}</td><td>${esc(r.key)}</td>
          <td class="muted">${esc(r.platform).slice(0, 60)}</td><td><button data-id="${esc(r.id)}">open</button></td></tr>`).join('')}
        </table></div>`).join('');
  } catch (e) {
    statusEl.textContent = `failed: ${e.message}`;
  }
}

async function open(id) {
  const r = await call({ action: 'get', id });
  document.getElementById('detail').innerHTML = `<h2>${esc(id)}</h2><pre>${esc(JSON.stringify(r, null, 2))}</pre>`;
}

/** the hash marks are cumulative: the first one that differs is where the games drifted apart */
async function compare(ids) {
  const reports = await Promise.all(ids.map((id) => call({ action: 'get', id })));
  const sections = ['models', 'hp', 'economy', 'actors', 'stats', 'total'];
  // the latest battle start each client logged, to put the round's units side by side
  const lastStart = (r) => [...(r.data?.events ?? [])].reverse().find((e) => e.category === 'sim.battleStart');
  let firstDiff = null;
  const rows = sections.map((s) => {
    const vals = reports.map((r) => r.data?.hashParts?.[s]);
    const differ = new Set(vals.map(String)).size > 1;
    if (differ && !firstDiff) firstDiff = s;
    return `<tr><td>${s}</td>${vals.map((v) => `<td class="${differ ? 'diff' : 'same'}">${esc(v)}</td>`).join('')}</tr>`;
  });
  const starts = reports.map((r) => lastStart(r)?.data);
  document.getElementById('detail').innerHTML = `
    <h2>compare (round ${esc(reports[0]?.round)}) — first difference: <span class="diff">${esc(firstDiff ?? 'none')}</span></h2>
    <table><tr><th>section</th>${reports.map((r) => `<th>${esc(r.role)} ${esc(r.name)}</th>`).join('')}</tr>${rows.join('')}</table>
    <h3>last battle start per client</h3>
    <div style="display:grid;grid-template-columns:repeat(${reports.length},1fr);gap:8px">
      ${starts.map((d) => `<pre>${esc(JSON.stringify(d, null, 1))}</pre>`).join('')}
    </div>`;
}

/** every report of one match (all clients, all kinds), oldest first, as one pretty JSON text */
async function matchText(matchKey) {
  const all = await call({ action: 'match', matchKey });
  return JSON.stringify(all, null, 1);
}

async function copyMatch(matchKey, button) {
  const text = await matchText(matchKey);
  await navigator.clipboard.writeText(text);
  button.textContent = `copied (${Math.round(text.length / 1024)} KB)`;
}

async function downloadMatch(matchKey) {
  const text = await matchText(matchKey);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = `melodan-match-${matchKey}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById('load').addEventListener('click', load);
document.addEventListener('click', (e) => {
  const id = e.target.dataset?.id;
  if (id) void open(id);
  const copyKey = e.target.dataset?.copyMatch;
  if (copyKey) void copyMatch(copyKey, e.target).catch((err) => (e.target.textContent = `failed: ${err.message}`));
  const dlKey = e.target.dataset?.downloadMatch;
  if (dlKey) void downloadMatch(dlKey).catch((err) => (statusEl.textContent = `failed: ${err.message}`));
  const cmp = e.target.dataset?.compare;
  if (cmp) void compare(cmp.split(',').filter(Boolean));
});
</script>
</body>
</html>
